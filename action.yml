name: Create a Quadraticc build or upload test results
description: Register a build or upload a JUnit/TRX test report with optional workflow provenance.
author: Quadraticc
branding:
  icon: package
  color: green
inputs:
  url:
    description: Quadraticc HTTPS origin. Defaults to https://app.quadrati.cc.
    default: https://app.quadrati.cc
  token:
    description: Project CI credential stored in GitHub Actions secrets.
    required: true
  workspace-id:
    description: Quadraticc workspace UUID.
    required: true
  project-id:
    description: Quadraticc project UUID.
    required: true
  version:
    description: Explicit build version. Supply exactly one of version or version-prefix when registering; omit when promoting build-id.
  version-prefix:
    description: Series for server-allocated versions, such as 0.0. Supply exactly one of version or version-prefix when registering; omit when promoting build-id.
  version-suffix:
    description: Optional semantic prerelease/metadata suffix for numbered builds, such as -abc123. Requires version-prefix.
  is-release:
    description: Mark the build as a release. One-way promotion; requires server migration 0032_build_releases.sql.
    default: 'false'
  build-id:
    description: Existing build UUID to mark as a release instead of registering a build. Requires is-release true; omit version inputs, images, metadata and workflow linking.
  branch:
    description: Branch the artifact was built from.
    default: ${{ github.head_ref || github.ref_name }}
  commit-sha:
    description: Full commit SHA of the built artifact. Defaults to the workflow commit.
    default: ${{ github.sha }}
  images:
    description: Optional JSON object of named, digest-pinned images, such as web and migrations.
  metadata:
    description: Optional JSON object of non-secret string metadata, such as migration_name.
  link-workflow-run:
    description: Associate this build or test report with the current GitHub.com run in a repository already connected to this Quadraticc project.
    default: 'false'
  test-results-file:
    description: Path to one UTF-8 JUnit/TRX XML report, at most 8 MiB. Selects upload-only mode; omit build registration/release inputs.
  test-results-format:
    description: Report format, junit or trx. Used with test-results-file.
    default: junit
  test-results-upload-id:
    description: Retry key of 1–200 UTF-8 bytes. Defaults to run ID/attempt/report basename. Use distinct IDs for separate reports and attempts; preserve the ID and payload for retries.
  workflow-run-id:
    description: Optional Quadraticc workflow run UUID for test uploads. Cannot be combined with link-workflow-run.
outputs:
  test-report-id:
    description: Accepted test report UUID (upload mode only).
  test-results:
    description: JSON receipt containing id, total, passed, failed, errors and skipped (upload mode only).
  is-release:
    description: Whether the acknowledged build is a release.
  build-id:
    description: Quadraticc build UUID.
  version:
    description: Created or reused build version.
  commit-sha:
    description: Commit SHA recorded on the build.
  branch:
    description: Branch recorded on the build, or an empty string.
  images:
    description: Named image references recorded on the build, as a JSON object.
  metadata:
    description: Build metadata recorded on the build, as a JSON object.
  url:
    description: Link to this build in Quadraticc.
  created:
    description: 'true for a new build; false when reusing or promoting an existing build.'
runs:
  using: node24
  main: dist/index.js
