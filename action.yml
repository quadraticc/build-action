name: Create a Quadraticc build
description: Register a build with an explicit version or let Quadraticc allocate the next version.
author: Quadraticc
branding:
  icon: package
  color: green
inputs:
  url:
    description: Quadraticc HTTPS origin. Defaults to https://app.quadrati.cc.
    default: https://app.quadrati.cc
  token:
    description: Project CI credential stored in GitHub Actions secrets.
    required: true
  workspace-id:
    description: Quadraticc workspace UUID.
    required: true
  project-id:
    description: Quadraticc project UUID.
    required: true
  version:
    description: Explicit build version. Supply exactly one of version or version-prefix.
  version-prefix:
    description: Series for server-allocated versions, such as 0.0. Supply exactly one of version or version-prefix.
  version-suffix:
    description: Optional semantic prerelease/metadata suffix for numbered builds, such as -abc123. Requires version-prefix.
  branch:
    description: Branch the artifact was built from.
    default: ${{ github.head_ref || github.ref_name }}
  commit-sha:
    description: Full commit SHA of the built artifact. Defaults to the workflow commit.
    default: ${{ github.sha }}
  images:
    description: Optional JSON object of named, digest-pinned images, such as web and migrations.
  metadata:
    description: Optional JSON object of non-secret string metadata, such as migration_name.
  link-workflow-run:
    description: Associate this GitHub.com run with a repository already connected to this Quadraticc project.
    default: 'false'
outputs:
  build-id:
    description: Quadraticc build UUID.
  version:
    description: Created or reused build version.
  commit-sha:
    description: Commit SHA recorded on the build.
  branch:
    description: Branch recorded on the build, or an empty string.
  images:
    description: Named image references recorded on the build, as a JSON object.
  metadata:
    description: Build metadata recorded on the build, as a JSON object.
  url:
    description: Link to this build in Quadraticc.
  created:
    description: 'true for a new build; false when numbered creation reuses an identical build.'
runs:
  using: node24
  main: dist/index.js
